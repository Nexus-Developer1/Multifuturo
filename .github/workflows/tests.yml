# Testes e estilo em cada push/PR. Mesma stack dos testes locais:
# PHP 8.3, MySQL 8.4 (JSON nativo), Redis. Sem segredos — .env.example chega.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    name: Pest + Pint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u sail -ppassword --silent"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, mysqli, xml, dom, gd, redis, zip
          coverage: none

      # O .env tem de existir ANTES do composer install: o package:discover arranca a
      # aplicação e, sem APP_ENV, ela assume produção e recusa arrancar sem AMI (por desenho).
      - name: Ambiente
        run: cp .env.example .env

      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress
        env:
          APP_ENV: testing

      - name: Chave da aplicação
        run: php artisan key:generate --force
        env:
          APP_ENV: testing

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Assets
        run: npm ci && npm run build

      - name: Estilo (Pint)
        run: ./vendor/bin/pint --test

      - name: Testes (Pest)
        # Em caso de falha, as linhas relevantes saem como annotations (visíveis sem login).
        run: |
          set +e
          ./vendor/bin/pest --ci 2>&1 | tee pest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            { grep -E "FAILED|ERROR|Error|Exception|Tests:" pest.log | head -n 5; head -n 5 pest.log; } | sed 's/^/::error::/'
          fi
          exit $code
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: sail
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
