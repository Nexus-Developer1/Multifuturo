# Multifuturo Propriedades — produção.
#
#   docker compose -f compose.production.yaml up -d --build
#
# Cinco serviços, os mesmos que correm em desenvolvimento, sem o Mailpit:
#   app        Apache + PHP (a aplicação e os estáticos)
#   queue      fila: emails dos pedidos
#   scheduler  agendador: cópias de segurança, importação mensal do INE
#   mysql      MySQL 8.4
#   redis      cache, sessões e fila
#
# Só o app expõe uma porta (HTTP_PORT). O HTTPS termina à frente — no
# Apache/painel do servidor anfitrião, que faz proxy para esta porta
# (DEPLOY.md §10). A base de dados e o Redis ficam na rede interna. Os dados
# vivem em volumes com nome (ver o fim do ficheiro). As variáveis vêm do
# .env do servidor (ver .env.production.example).

services:
    app:
        build:
            context: .
            dockerfile: docker/production/Dockerfile
            target: app
        image: multifuturo/app
        restart: unless-stopped
        env_file: '${ENV_FILE:-.env}'
        ports:
            - '${HTTP_PORT:-8080}:80'
        volumes:
            - 'storage_public:/var/www/html/storage/app/public'
            - 'storage_private:/var/www/html/storage/app/private'
            - 'backups:/var/www/html/storage/backups'
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - multifuturo

    queue:
        image: multifuturo/app
        restart: unless-stopped
        env_file: '${ENV_FILE:-.env}'
        user: www-data
        command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600', '--sleep=1', '--memory=128']
        # A verificação de saúde da imagem é a do Apache (porta 80); não se aplica aqui.
        healthcheck:
            disable: true
        volumes:
            - 'storage_public:/var/www/html/storage/app/public'
            - 'storage_private:/var/www/html/storage/app/private'
            - 'backups:/var/www/html/storage/backups'
        depends_on:
            app:
                condition: service_healthy
        networks:
            - multifuturo

    scheduler:
        image: multifuturo/app
        restart: unless-stopped
        env_file: '${ENV_FILE:-.env}'
        user: www-data
        command: ['php', 'artisan', 'schedule:work']
        healthcheck:
            disable: true
        volumes:
            - 'storage_public:/var/www/html/storage/app/public'
            - 'storage_private:/var/www/html/storage/app/private'
            - 'backups:/var/www/html/storage/backups'
        depends_on:
            app:
                condition: service_healthy
        networks:
            - multifuturo

    mysql:
        image: 'mysql:8.4'
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: '${DB_DATABASE:?DB_DATABASE em falta no .env}'
            MYSQL_USER: '${DB_USERNAME:?DB_USERNAME em falta no .env}'
            MYSQL_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD em falta no .env}'
            # A root só existe dentro do contentor (sem porta exposta); fica com a mesma palavra-passe.
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
        # utf8mb4 + colação 0900_ai_ci: acentos ordenados como em português
        # (Águeda antes de Amadora) e comparações sem distinguir maiúsculas.
        command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
        volumes:
            - 'mysql:/var/lib/mysql'
        healthcheck:
            test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" --silent']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - multifuturo

    redis:
        image: 'redis:7-alpine'
        restart: unless-stopped
        # appendonly: a fila sobrevive a um reinício do servidor.
        command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction']
        volumes:
            - 'redis:/data'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - multifuturo

networks:
    multifuturo:
        driver: bridge

# Os dados. Apagar um destes volumes é apagar dados de produção.
volumes:
    mysql:            # base de dados
    redis:            # fila e sessões
    storage_public:   # fotografias das fichas
    storage_private:  # documentos das fichas (nunca servidos diretamente)
    backups:          # cópias de segurança diárias (copiar para fora do servidor!)
